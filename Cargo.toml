[package]
name = "temporal-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
glib = { version = "0.20", package = "glib" }
gio = { version = "0.20", package = "gio", features = ["v2_80"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
git2 = "0.19"
bitflags = "2"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_7"]

# Dev-only: used by unit tests in src/tests/ to create temporary git repos.
[dev-dependencies]
tempfile = "3"
