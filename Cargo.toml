[package]
name = "temporal-explorer"
version = "0.2.0"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
glib = { version = "0.20", package = "glib" }
gio = { version = "0.20", package = "gio", features = ["v2_80"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
git2 = "0.19"
bitflags = "2"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_7"]

# Dev-only: used by unit tests in src/tests/ to create temporary git repos.
[dev-dependencies]
tempfile = "3"

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 0          # No optimisation — fastest to compile
debug = 1              # Line numbers only (not full DWARF) — smaller & faster
incremental = true     # Cache unchanged crates between rebuilds
codegen-units = 256    # Maximum parallelism during compilation
split-debuginfo = "unpacked"  # Fastest debug-info strategy on Linux

# Use mold linker for dev builds — significantly faster linking on Linux.
# Install with: sudo pacman -S mold
[profile.dev.build-override]
opt-level = 0

# Compile heavy C-backed dependencies at full optimisation once,
# so they are cached and never recompiled on incremental dev builds.
# This is the single biggest win for day-to-day edit→compile cycles.
[profile.dev.package.gtk4]
opt-level = 3
[profile.dev.package.gtk4-sys]
opt-level = 3
[profile.dev.package.libadwaita]
opt-level = 3
[profile.dev.package.libadwaita-sys]
opt-level = 3
[profile.dev.package.glib]
opt-level = 3
[profile.dev.package.glib-sys]
opt-level = 3
[profile.dev.package.gio]
opt-level = 3
[profile.dev.package.gio-sys]
opt-level = 3
[profile.dev.package.gdk4]
opt-level = 3
[profile.dev.package.gdk4-sys]
opt-level = 3
[profile.dev.package.git2]
opt-level = 3
[profile.dev.package.libgit2-sys]
opt-level = 3
[profile.dev.package.gettext-rs]
opt-level = 3
[profile.dev.package.gettext-sys]
opt-level = 3

# ── Release profile (distribution / Flatpak) ─────────────────────────────────

[profile.release]
opt-level = 3
lto = "thin"           # Thin LTO: good balance of size/speed vs compile time
codegen-units = 1      # Maximum optimisation at the cost of compile time
strip = "debuginfo"    # Strip debug symbols from the release binary
