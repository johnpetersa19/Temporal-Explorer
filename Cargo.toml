[package]
name = "temporal-explorer"
version = "0.1.0"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
git2 = "0.19"

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]

# Dev-only: used by unit tests in src/tests/ to create temporary git repos.
# Never compiled into the release binary.
[dev-dependencies]
tempfile = "3"
