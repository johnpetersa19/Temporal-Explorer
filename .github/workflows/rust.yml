name: Rust (Arch)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base

    steps:
    - uses: actions/checkout@v4

    - name: Update system and install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed \
          base-devel \
          git \
          meson \
          ninja \
          pkgconf \
          gtk4 \
          libadwaita \
          glib2 \
          libgit2 \
          blueprint-compiler \
          appstream \
          desktop-file-utils \
          gettext \
          libxml2 \
          rustup \
          cargo

    - name: Initialize Rust toolchain
      run: |
        rustup toolchain install stable
        rustup default stable
        rustc --version
        cargo --version

    - name: Check GLib via pkg-config
      run: |
        echo "Default pc_path:"
        pkgconf --variable pc_path pkg-config || true

        echo "glib-2.0 version:"
        pkgconf --modversion glib-2.0

        echo "glib-2.0 flags:"
        pkgconf --cflags --libs glib-2.0

    - name: Lint Blueprint (.blp) files
      run: |
        echo "=== blueprint-compiler version ==="
        blueprint-compiler --version

        BLP_FILES=$(find . -name '*.blp' -not -path './.git/*')

        if [ -z "$BLP_FILES" ]; then
          echo "No .blp files found — skipping lint."
          exit 0
        fi

        echo "Found .blp files:"
        echo "$BLP_FILES"
        echo ""

        FAILED=0
        for f in $BLP_FILES; do
          echo "--- Checking: $f ---"
          # blueprint-compiler batch-compile compiles to a temp dir;
          # any parse/type error is printed to stderr and exits non-zero.
          if ! blueprint-compiler batch-compile /tmp/blp-check "$(dirname "$f")" "$(basename "$f")" 2>&1; then
            echo "FAIL: $f"
            FAILED=1
          else
            echo "OK:   $f"
          fi
        done

        if [ "$FAILED" -eq 1 ]; then
          echo ""
          echo "One or more .blp files have errors. Fix them before merging."
          exit 1
        fi

        echo ""
        echo "All .blp files passed blueprint-compiler lint."

    - name: Build with Meson
      run: |
        meson setup builddir
        meson compile -C builddir

    - name: Run tests
      run: meson test -C builddir
