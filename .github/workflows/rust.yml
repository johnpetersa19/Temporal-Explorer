name: Rust (Arch)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base

    steps:
    - uses: actions/checkout@v4

    - name: Update system and install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm --needed \
          base-devel \
          git \
          meson \
          ninja \
          pkgconf \
          gtk4 \
          libadwaita \
          glib2 \
          libgit2 \
          blueprint-compiler \
          appstream \
          desktop-file-utils \
          gettext \
          libxml2

    - name: Check GLib via pkg-config
      run: |
        echo "Default pc_path:"
        pkgconf --variable pc_path pkg-config || true

        echo "glib-2.0 version:"
        pkgconf --modversion glib-2.0

        echo "glib-2.0 flags:"
        pkgconf --cflags --libs glib-2.0

    - name: Build with Meson
      run: |
        meson setup builddir
        meson compile -C builddir

    - name: Run tests
      run: meson test -C builddir
