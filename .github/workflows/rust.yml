name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson \
          ninja-build \
          libgtk-4-dev \
          libadwaita-1-dev \
          libglib2.0-dev \
          libgit2-dev \
          libgettext-rs-dev \
          pkg-config \
          blueprint-compiler \
          appstream \
          desktop-file-utils
    - name: Build com Meson
      run: |
        meson setup builddir
        meson compile -C builddir
    - name: Run tests
      run: meson test -C builddir
