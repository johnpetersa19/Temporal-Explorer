name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson \
          ninja-build \
          libgtk-4-dev \
          libadwaita-1-dev \
          libglib2.0-dev \
          libgit2-dev \
          pkg-config \
          blueprint-compiler \
          appstream \
          desktop-file-utils \
          gettext \
          libxml2-utils
        # Ensure pkg-config can find glib
        sudo find /usr/lib -name "glib-2.0.pc" -o -name "gobject-2.0.pc"
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV
    - name: Build com Meson
      run: |
        meson setup builddir
        meson compile -C builddir
    - name: Run tests
      run: meson test -C builddir
