# .cargo/config.toml
#
# NOTE: mold linker config is intentionally NOT here — it would break CI
# environments that don't have clang/mold installed.
#
# To enable mold locally on Arch Linux for faster dev builds:
#   sudo pacman -S mold clang
#   Add to your ~/.cargo/config.toml (global, not this file):
#
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=mold"]
